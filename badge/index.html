<!doctype html>
<html lang="it" dir="ltr" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Badge · Tribunus Plebis</title>
  <meta name="description" content="Un sito non violento e non partitico dove le persone di ogni paese si fanno sentire, con fatti verificabili e rispetto reciproco.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tribunus Plebis">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Siamo umani · Tribunus Plebis">
  <meta property="og:description" content="Un sito non violento e non partitico dove le persone di ogni paese si fanno sentire, con fatti verificabili e rispetto reciproco.">
  <meta property="og:image" content="__SITE_URL__/assets/img/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Siamo umani. Siamo tutti fratelli e sorelle, da New York a Kiev, da Mosca a Tokyo, da Roma a Sydney.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="__SITE_URL__/assets/img/social.png">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/theme-init.js"></script>
  <script type="module" src="../assets/js/badge.js"></script>
</head>
<body data-page="badge" data-title="badge.docTitle">
  <main id="main" tabindex="-1">
    <noscript>
      <div class="container"><p class="notice">
        <span lang="it">Questo sito richiede JavaScript.</span> /
        <span lang="en">This site requires JavaScript.</span> /
        <span lang="fr">Ce site nécessite JavaScript.</span>
      </p></div>
    </noscript>

    <div class="container prose">
      <h1 data-i18n="badge.h1"></h1>
      <p class="lead" data-i18n="badge.intro"></p>

      <div class="badge-tool">
        <div class="field">
          <label for="badge-lang" data-i18n="badge.language"></label>
          <select id="badge-lang"></select>
        </div>

        <fieldset class="field style-field">
          <legend data-i18n="badge.styleTitle"></legend>
          <label class="choice"><input type="radio" name="badge-style" value="dark" checked> <span data-i18n="badge.styleDark"></span></label>
          <label class="choice"><input type="radio" name="badge-style" value="light"> <span data-i18n="badge.styleLight"></span></label>
          <label class="choice"><input type="radio" name="badge-style" value="auto"> <span data-i18n="badge.styleAuto"></span></label>
          <p id="style-note" class="muted" hidden data-i18n="badge.styleAutoNote"></p>
        </fieldset>

        <section class="badge-preview" aria-labelledby="preview-title">
          <h2 id="preview-title" class="visually-hidden" data-i18n="badge.preview"></h2>
          <a id="badge-link" href="../"><img id="badge-preview" src="../badges/badge-it.svg" alt="" width="320" height="40"></a>
          <div id="badge-compare" class="badge-compare" hidden>
            <figure>
              <a href="../"><img id="badge-preview-dark" src="../badges/badge-it.svg" alt="" width="320" height="40"></a>
              <figcaption data-i18n="badge.previewDark"></figcaption>
            </figure>
            <figure>
              <a href="../"><img id="badge-preview-light" src="../badges/badge-it-light.svg" alt="" width="320" height="40"></a>
              <figcaption data-i18n="badge.previewLight"></figcaption>
            </figure>
          </div>
        </section>

        <p id="badge-draft" class="notice" hidden>
          <span data-i18n="badge.draftNote"></span>
          <span id="badge-progress"></span>
          <a id="badge-review-link" data-repo-path="issues/new?template=badge-review.yml" hidden data-i18n="badge.reviewCta"></a>
        </p>
        <p id="badge-reviewed" class="notice notice-ok" hidden data-i18n="badge.reviewedNote"></p>

        <p id="local-note" class="notice" hidden data-i18n="badge.localNote"></p>

        <section id="md-section" aria-labelledby="md-title">
          <h2 id="md-title" data-i18n="badge.markdownTitle"></h2>
          <pre class="snippet"><code id="snippet-markdown"></code></pre>
          <button type="button" class="button secondary" id="copy-markdown" data-i18n="badge.copy"></button>
        </section>

        <section aria-labelledby="html-title">
          <h2 id="html-title" data-i18n="badge.htmlTitle"></h2>
          <pre class="snippet"><code id="snippet-html"></code></pre>
          <button type="button" class="button secondary" id="copy-html" data-i18n="badge.copy"></button>
        </section>

        <p id="copy-status" class="muted" role="status" aria-live="polite"></p>

        <section aria-labelledby="why-title">
          <h2 id="why-title" data-i18n="badge.whyTitle"></h2>
          <p data-i18n="badge.why"></p>
        </section>

        <section class="share-block" data-i18n-attr="aria-label:share.button">
          <button type="button" class="button" id="share-button" data-i18n="share.button"></button>
          <p id="share-status" class="muted" role="status" aria-live="polite"></p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
