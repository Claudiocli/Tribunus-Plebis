name: Rivedi o correggi una traduzione
description: Parli bene una lingua del sito o del badge? Aiutaci a controllare il testo.
title: "[Traduzione] "
labels: ["traduzione"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie! Le traduzioni sono scritte con l'aiuto di un modello linguistico e **non sono ancora riviste da madrelingua**: il tuo controllo conta molto.

        Per il **testo di un badge** usa invece il modulo «Conferma o correggi il testo di un badge»: è quello che permette di togliere la dicitura «bozza».

        **Le segnalazioni su GitHub sono pubbliche.** Non scrivere dati personali tuoi o di altri (indirizzi, telefoni, email).

        _English: translations were drafted with a language model and have not yet been reviewed by native speakers. Issues on GitHub are public: do not include personal data._
  - type: input
    id: lingua
    attributes:
      label: Lingua
      placeholder: Español (es)
    validations:
      required: true
  - type: dropdown
    id: dove
    attributes:
      label: Che cosa vuoi correggere?
      options:
        - I testi del sito
        - Altro
    validations:
      required: true
  - type: textarea
    id: attuale
    attributes:
      label: Testo attuale
      description: Copialo dal sito o dal badge.
  - type: textarea
    id: proposta
    attributes:
      label: Come dovrebbe essere
      description: Il testo corretto, nella lingua in questione.
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: Perché
      description: Facoltativo. Per esempio «suona innaturale» oppure «è un errore di grammatica».
  - type: checkboxes
    id: conferme
    attributes:
      label: Conferme
      options:
        - label: È la mia lingua madre, oppure la parlo a livello avanzato.
          required: true
        - label: Non ho scritto dati personali di nessuno.
          required: true
