name: Proponi una notizia o un dato
description: Proponi una voce per il sito, con una fonte che si può controllare.
title: "[Proposta] "
labels: ["proposta"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie! Per pubblicare una voce ci servono **fatti con fonte**, riassunti con parole tue.

        **Le segnalazioni su GitHub sono pubbliche.** Non scrivere dati personali tuoi o di altri (indirizzi, telefoni, email) e non attaccare persone o popoli.

        _English: please propose facts with a public source, summarised in your own words. Issues on GitHub are public: do not include personal data._
  - type: dropdown
    id: tipo
    attributes:
      label: Che cosa proponi?
      options:
        - Notizia (un fatto accaduto)
        - Richiesta e stato della risposta
        - Dato o statistica
    validations:
      required: true
  - type: input
    id: sezione
    attributes:
      label: Per quale sezione?
      description: Per ora esiste «Italia – Sud». Se è per un altro paese, usa prima il modulo «Proponi una sezione».
      placeholder: Italia – Sud
    validations:
      required: true
  - type: input
    id: titolo
    attributes:
      label: Titolo breve
      placeholder: Presidio dei trattori a Foggia
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: Data del fatto o del dato (AAAA-MM-GG)
      placeholder: 2026-10-18
    validations:
      required: true
  - type: textarea
    id: riassunto
    attributes:
      label: Riassunto con parole tue (2 o 3 righe)
      description: Non copiare il testo dell'articolo. Scrivi solo ciò che la fonte dice davvero.
    validations:
      required: true
  - type: input
    id: fonte_nome
    attributes:
      label: Nome della fonte
      placeholder: ISTAT, Il Sole 24 Ore, Coldiretti…
    validations:
      required: true
  - type: input
    id: fonte_url
    attributes:
      label: Link alla fonte (https://…)
      description: Un indirizzo che chiunque può aprire, senza registrarsi o pagare.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: di_parte
    attributes:
      label: Cifre o dichiarazioni di parte? Di chi sono?
      description: Se un numero lo dà un'organizzazione (per esempio «secondo gli organizzatori»), scrivilo qui. Se è un dato ufficiale, lascia vuoto.
  - type: textarea
    id: dato
    attributes:
      label: Solo per un dato o una statistica
      description: Valore, periodo a cui si riferisce ed ente che lo ha prodotto.
      placeholder: "Valore: 6,2% · Periodo: agosto 2026 · Ente: ISTAT"
  - type: checkboxes
    id: conferme
    attributes:
      label: Conferme
      options:
        - label: Ho letto la fonte e il riassunto corrisponde a ciò che dice.
          required: true
        - label: La fonte è pubblica e raggiungibile da chiunque.
          required: true
        - label: Il riassunto è scritto con parole mie e non contiene dati personali di terzi.
          required: true
        - label: Il contenuto non incita né giustifica la violenza, non attacca persone o popoli e non è propaganda di partito.
          required: true
