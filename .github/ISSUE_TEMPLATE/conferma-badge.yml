name: Conferma o correggi il testo di un badge
description: Sei madrelingua? Dicci se la frase del badge è corretta e naturale nella tua lingua.
title: "[Badge] "
labels: ["traduzione", "badge"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie! Le frasi dei badge sono scritte con l'aiuto di un modello linguistico: **finché non le conferma chi parla la lingua, il sito le segna come bozza**. Quando due madrelingua indipendenti confermano lo stesso testo, la dicitura sparisce.

        Per favore leggi la frase **nella tua lingua**, come la leggerebbe un amico: suona naturale? È rispettosa e senza errori?

        **Le segnalazioni su GitHub sono pubbliche.** Non scrivere dati personali tuoi o di altri (indirizzi, telefoni, email).

        _English: please read the sentence in your own language and tell us if it is correct and natural. Two independent native speakers confirming the same text remove the "draft" label. Issues on GitHub are public: do not include personal data._
  - type: input
    id: lingua
    attributes:
      label: Lingua
      description: Di solito è già compilata dal sito.
      placeholder: Español (es)
    validations:
      required: true
  - type: textarea
    id: testo_attuale
    attributes:
      label: Testo attuale del badge
      description: Di solito è già compilato dal sito. Non modificarlo, perché serve a sapere quale testo hai letto.
    validations:
      required: true
  - type: dropdown
    id: verdetto
    attributes:
      label: Che ne pensi?
      options:
        - Il testo è corretto e naturale
        - Il testo si capisce ma propongo una correzione
        - Il testo è sbagliato o innaturale e va riscritto
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Testo corretto (solo se hai scelto una correzione)
      description: Scrivi la frase come dovrebbe essere, nella tua lingua. Deve restare breve, due righe al massimo.
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Facoltativo. Per esempio il maschile/femminile, il registro più o meno formale, le differenze tra paesi che parlano la stessa lingua.
  - type: checkboxes
    id: conferme
    attributes:
      label: Conferme
      options:
        - label: È la mia lingua madre, oppure la parlo a livello avanzato.
          required: true
        - label: Ho letto il testo nella lingua indicata, senza basarmi solo su un traduttore automatico.
          required: true
        - label: Non ho scritto dati personali di nessuno.
          required: true
