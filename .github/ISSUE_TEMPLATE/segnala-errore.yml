name: Segnala un errore o chiedi una correzione
description: Una voce del sito non rispecchia la fonte, è sbagliata o superata.
title: "[Correzione] "
labels: ["correzione"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie! Una correzione è più veloce da verificare se indichi **quale voce** e **il documento che la smentisce**.

        **Le segnalazioni su GitHub sono pubbliche.** Non scrivere dati personali tuoi o di altri (indirizzi, telefoni, email).

        _English: tell us which entry is wrong and link the document that shows it. Issues on GitHub are public: do not include personal data._
  - type: input
    id: dove
    attributes:
      label: Quale voce o pagina?
      description: Il titolo della voce o l'indirizzo della pagina.
      placeholder: Blocchi stradali in Puglia
    validations:
      required: true
  - type: textarea
    id: cosa_non_va
    attributes:
      label: Cosa non va?
      description: Cosa dice il sito e cosa dice invece la fonte.
    validations:
      required: true
  - type: input
    id: fonte_url
    attributes:
      label: Link al documento che lo dimostra (https://…)
      description: Un indirizzo che chiunque può aprire, senza registrarsi o pagare.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: correzione
    attributes:
      label: Come dovrebbe essere
      description: Se vuoi, proponi tu il testo corretto, con parole tue.
  - type: checkboxes
    id: conferme
    attributes:
      label: Conferme
      options:
        - label: Ho controllato il documento indicato e contraddice la voce del sito.
          required: true
        - label: Non ho scritto dati personali di nessuno.
          required: true
