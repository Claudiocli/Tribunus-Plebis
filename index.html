<body data-page="home" data-title="home.docTitle">
  <main id="main" tabindex="-1">
    <noscript>
      <div class="container"><p class="notice">
        <span lang="it">Questo sito richiede JavaScript.</span> /
        <span lang="en">This site requires JavaScript.</span> /
        <span lang="fr">Ce site nécessite JavaScript.</span>
      </p></div>
    </noscript>

    <div class="container">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" data-i18n="home.h1"></h1>
        <p class="lead" data-i18n="home.lead"></p>
        <p class="sub" data-i18n="home.sub"></p>
        <div class="actions">
          <a class="button" href="./badge/" data-i18n="home.ctaBadge"></a>
          <a class="button secondary" href="./it-sud/" data-i18n="home.ctaItSud"></a>
          <button type="button" class="button secondary" id="share-button" data-i18n="share.button"></button>
        </div>
        <p id="share-status" class="muted" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="manifesto-title">
        <h2 id="manifesto-title" data-i18n="home.manifesto.title"></h2>
        <p class="lead" data-i18n="home.manifesto.intro"></p>
        <ul class="principles" id="principles"></ul>
        <p class="muted" data-i18n="home.manifesto.note"></p>
      </section>

      <section aria-labelledby="places-title">
        <h2 id="places-title" data-i18n="home.places.title"></h2>
        <p data-i18n="home.places.intro"></p>
        <div class="places">
          <article class="card">
            <h3 data-i18n="home.places.itsud.title"></h3>
            <p data-i18n="home.places.itsud.text"></p>
            <p><a class="button" href="./it-sud/" data-i18n="home.places.itsud.cta"></a></p>
          </article>
          <article class="card">
            <h3 data-i18n="home.places.francia.title"></h3>
            <p data-i18n="home.places.francia.text"></p>
            <p><a class="button" href="./francia/" data-i18n="home.places.francia.cta"></a></p>
          </article>
          <article class="card">
            <h3 data-i18n="home.places.next.title"></h3>
            <p data-i18n="home.places.next.text"></p>
            <p data-repo-wrap hidden><a class="button secondary" data-repo-path="issues/new?template=proponi-sezione-paese.yml" hidden data-i18n="home.places.next.cta"></a></p>
          </article>
        </div>
      </section>
    </div>
  </main>
